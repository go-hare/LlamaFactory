### model
model_name_or_path: google/gemma-4-E2B-it
trust_remote_code: true
new_special_tokens_config: examples/train_lora/gemma4_duplex_tokens.yaml
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
trainable_token_indices: "6,7,8,9,10,11,12,13"
trainable_tokens_lr: 5.0e-3
duplex_token_weights: "8:8.0,9:4.0,11:5.0,12:6.0,13:7.0"

### dataset
dataset: gemma4_route2_stage1
eval_dataset: gemma4_route2_stage1_valid
template: gemma4n_duplex
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: outputs/gemma4_route2_stage1_lora
logging_steps: 40
save_steps: 150
save_total_limit: 2
overwrite_output_dir: true
save_only_model: true
report_to: none

### train (A100 80G: 等效 batch_size = 4x2 = 8, 3 Epochs ≈ 390 steps ≈ 7 mins)
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.5e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 30
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 130
prediction_loss_only: true
