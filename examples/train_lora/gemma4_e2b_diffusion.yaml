### model
model_name_or_path: google/gemma-4-E2B-it
trust_remote_code: true

### method
stage: diffusion
do_train: true
# Section 4 conversion: full-parameter training from AR E2B, not LoRA / not section 8.
finetuning_type: full

### dataset
dataset_dir: /workspace/diffusion_600m
dataset: train
eval_dataset: valid
# Prompt cap ~p99. Response is K=18 * C=256 = 4608 in workflow.py.
cutoff_len: 4096
max_samples: 600000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /workspace/saves/gemma4-e2b/diffusion
logging_steps: 10
save_steps: 2000
save_total_limit: 3
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.125e-4
weight_decay: 1.0e-4
adam_beta1: 0.95
adam_beta2: 0.99
max_grad_norm: 1.0
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 200
bf16: true
pure_bf16: true
# Keep BF16 weights/grads on GPU (~20 GiB) while accumulating FP32 master weights + moments in host RAM.
diffusion_master_weights: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 2000
load_best_model_at_end: false

### Section 5 off until named.
rl_steps: 0
rl_teacher_steps: 8
rl_student_steps: 2
