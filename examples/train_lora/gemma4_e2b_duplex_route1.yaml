### model
model_name_or_path: google/gemma-4-E2B-it
trust_remote_code: true
# 激活 Gemma-4 原词表预留槽位 ID 6~13 (<unused0>~<unused7>) 为单 Token 控制符，并携带语义热启动描述，不扩容 262144 词表！
new_special_tokens_config: examples/train_lora/gemma4_duplex_tokens.yaml
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,v_proj,k_proj,o_proj
# 冻结原装 300M gemma4_audio 音频编码器与视觉编码器（0 声学训练成本，保留谷歌原装听觉）
freeze_vision_tower: true
freeze_multi_modal_projector: true
# 仅训练 ID 6~13 这 8 个全双工状态机槽位增量（产出权重仅 ~15MB，告别多 GB 词表副本！）
trainable_token_indices: "6,7,8,9,10,11,12,13"
trainable_tokens_lr: 5.0e-3
# 全双工关键状态 Token 加权交叉熵 Loss (8:接话开口, 9:等待后台工具, 11:抗噪忽略, 12:真打断, 13:取消旧工具)
duplex_token_weights: "8:8.0,9:4.0,11:4.0,12:6.0,13:6.0"

### dataset
dataset: gemma4_duplex_route1
eval_dataset: gemma4_duplex_route1_valid
template: gemma4n
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: saves/gemma4-e2b/lora/duplex_route1
logging_steps: 5
save_steps: 200
save_total_limit: 3
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 50
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
